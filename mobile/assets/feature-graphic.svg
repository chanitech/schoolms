  <!-- Wordmark + tagline -->
  <text x="420" y="215" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="88" font-weight="700" fill="#ffffff">Shule<tspan fill="#c9a24b">PRO</tspan></text>
  <text x="424" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#b8c4d8">Fees, results and receipts</text>
